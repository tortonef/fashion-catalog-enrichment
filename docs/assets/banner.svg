<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <!-- Shared portfolio banner layout. Per repo, change only: the accent color (#C8553D), eyebrow number,
       title, tagline lines and the motif group on the right. -->
  <title id="title">Fashion Catalog Enrichment</title>
  <desc id="desc">Turn a product photo into structured, catalog-ready attributes in seconds, with confidence scores and a human-review step, running 100% locally.</desc>
  <style>
    .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ink { fill: #1F1B24; }
    .accent { fill: #C8553D; }
  </style>

  <!-- Opaque background: legible in both GitHub light and dark mode -->
  <rect width="1280" height="320" fill="#F6F1E9"/>
  <rect width="10" height="320" class="accent"/>

  <!-- Text block -->
  <text x="72" y="92" class="font accent" font-size="15" font-weight="600" letter-spacing="3">GENAI FOR FASHION · 01 / 03</text>
  <text x="72" y="152" class="font ink" font-size="52" font-weight="700">Fashion Catalog Enrichment</text>
  <g class="font ink" font-size="20" fill-opacity="0.78">
    <text x="72" y="204">Turn a product photo into structured, catalog-ready attributes</text>
    <text x="72" y="232">in seconds, with confidence scores and a human-review step,</text>
    <text x="72" y="260">running 100% locally.</text>
  </g>

  <!-- Motif: photo -> attributes with confidence bars; the last one awaits human review -->
  <g transform="translate(840 50)">
    <rect width="190" height="220" rx="14" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
    <path transform="translate(95 118)" class="accent"
          d="M-58,-52 L-24,-70 Q0,-56 24,-70 L58,-52 L74,-16 L47,-6 L47,68 L-47,68 L-47,-6 L-74,-16 Z"/>
    <path transform="translate(95 118)" d="M-24,-70 Q0,-44 24,-70" fill="none" stroke="#F6F1E9" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#C8553D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1042 160 H1068"/>
    <path d="M1060 151 L1069 160 L1060 169"/>
  </g>
  <g transform="translate(1082 56)">
    <g>
      <rect width="150" height="38" rx="19" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="16" y="15" width="40" height="8" rx="4" class="ink" fill-opacity="0.35"/>
      <rect x="68" y="15" width="66" height="8" rx="4" class="ink" fill-opacity="0.08"/>
      <rect x="68" y="15" width="60" height="8" rx="4" class="accent"/>
    </g>
    <g transform="translate(0 54)">
      <rect width="150" height="38" rx="19" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="16" y="15" width="32" height="8" rx="4" class="ink" fill-opacity="0.35"/>
      <rect x="68" y="15" width="66" height="8" rx="4" class="ink" fill-opacity="0.08"/>
      <rect x="68" y="15" width="50" height="8" rx="4" class="accent"/>
    </g>
    <g transform="translate(0 108)">
      <rect width="150" height="38" rx="19" fill="#FFFFFF" stroke="#1F1B24" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="16" y="15" width="44" height="8" rx="4" class="ink" fill-opacity="0.35"/>
      <rect x="68" y="15" width="66" height="8" rx="4" class="ink" fill-opacity="0.08"/>
      <rect x="68" y="15" width="40" height="8" rx="4" class="accent"/>
    </g>
    <g transform="translate(0 162)">
      <rect width="150" height="38" rx="19" fill="#F6F1E9" stroke="#C8553D" stroke-width="2" stroke-dasharray="6 5"/>
      <rect x="16" y="15" width="36" height="8" rx="4" class="ink" fill-opacity="0.35"/>
      <rect x="68" y="15" width="66" height="8" rx="4" class="ink" fill-opacity="0.08"/>
      <rect x="68" y="15" width="18" height="8" rx="4" class="accent" fill-opacity="0.55"/>
    </g>
  </g>
</svg>
