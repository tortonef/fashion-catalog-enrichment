[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-enrichment"
version = "0.1.0"
description = "Turn a product photo into structured, catalog-ready attributes, 100% locally."
requires-python = "==3.12.*"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by `ruff format`; long strings stay readable

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the real model (downloaded by setup); excluded from CI"]
